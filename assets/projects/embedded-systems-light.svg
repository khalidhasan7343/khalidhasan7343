<svg xmlns="http://www.w3.org/2000/svg" width="600" height="170" viewBox="0 0 600 170" role="img" aria-labelledby="title description">
  <title id="title">MediSmart / Embedded Systems project cover</title>
  <desc id="description">Original schematic-inspired cover art for the ESP32 university prototype: a processor outline with pins, orthogonal circuit traces, and connected nodes. The illustration is conceptual, not a wiring diagram.</desc>

  <rect x="0.5" y="0.5" width="599" height="169" rx="8" fill="#FFFFFF" stroke="#D4D4D4" />
  <path d="M400 20V150" stroke="#D4D4D4" />
  <text x="24" y="29" fill="#555555" font-family="ui-monospace, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1.1">04 / EMBEDDED SYSTEMS</text>
  <g fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="-1">
    <text x="23" y="77">MediSmart</text>
    <text x="23" y="114">ESP32 Prototype</text>
  </g>
  <text x="24" y="147" fill="#555555" font-family="ui-monospace, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="11">SENSING → CONTROL → TELEMETRY</text>
  <g fill="none" stroke="#D4D4D4" stroke-width="1.5" stroke-linejoin="miter">
    <path d="M430 38H448V62H462M430 80H462M430 122H448V98H462M526 62H542V38H558M526 80H558M526 98H542V122H558" />
    <path d="M478 48V36H466V24M494 48V24M510 48V36H522V24M478 112V124H466V140M494 112V140M510 112V124H522V140" />
  </g>
  <rect x="462" y="48" width="64" height="64" rx="2" fill="#FFFFFF" stroke="#555555" stroke-width="1.5" />
  <rect x="470" y="56" width="48" height="48" fill="none" stroke="#D4D4D4" />
  <circle cx="475" cy="61" r="2" fill="#555555" />
  <text x="494" y="83" text-anchor="middle" fill="#111111" font-family="ui-monospace, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10">ESP32</text>
  <g fill="#FFFFFF" stroke="#555555" stroke-width="1.5">
    <circle cx="430" cy="38" r="3" /><circle cx="430" cy="80" r="3" /><circle cx="430" cy="122" r="3" />
