<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title description">
  <title id="title">KH / Neural Identity</title>
  <desc id="description">An original KH monogram inside a circular frame with three connected nodes. A single data signal travels down the upper connection. The monogram stays still.</desc>

  <style>@media (prefers-reduced-motion: reduce) { .signal { display: none; } }</style>
  <circle cx="80" cy="80" r="69" fill="#0B0B0C" stroke="#303030" />
  <circle cx="80" cy="80" r="46" fill="none" stroke="#303030" />
  <g fill="none" stroke="#A3A3A3" stroke-width="1.5">
    <path d="M80 11V34M21 115L40 104M139 115L120 104" />
  </g>
  <g fill="#0B0B0C" stroke="#F5F5F5" stroke-width="1.5">
    <circle cx="80" cy="11" r="4" />
    <circle cx="21" cy="115" r="4" />
    <circle cx="139" cy="115" r="4" />
  </g>
  <path d="M48 59V101M48 81L70 59M48 81L71 101M87 59V101M110 59V101M87 80H110" fill="none" stroke="#F5F5F5" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter" />
  <circle class="signal" cx="80" cy="15" r="2.5" fill="#F5F5F5">
    <animate attributeName="cy" dur="6s" values="15;32;32;15;15" keyTimes="0;0.2;0.3;0.3001;1" repeatCount="indefinite" />
    <animate attributeName="opacity" dur="6s" values="0;1;0;0" keyTimes="0;0.08;0.3;1" repeatCount="indefinite" />
  </circle>
</svg>
